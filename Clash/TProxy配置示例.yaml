#开始编辑配置时，心中牢记缩进和冒号引号，任何不懂，查看官方wiki：https://wiki.metacubex.one
#修改配置后如果内核不能启动，请查看日志，日志中会告诉你配置第几行写错
#或者使用在线yaml检测器进行检测（https://www.bejson.com/validators/yaml_editor/）

#=============== TPROXY 模式配置 ===============
# 本配置文件专为 TPROXY 模式设计
# 使用前请确保内核支持 TPROXY 功能
#=============================================

mixed-port: 7890
mode: rule
allow-lan: true
unified-delay: false
tcp-concurrent: true
find-process-mode: always
log-level: warning
ipv6: true

external-controller: 0.0.0.0:9090
external-ui: WebUI
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

# TPROXY 端口配置 (与 TProxy配置.txt 中的端口保持一致)
tproxy-port: 7893

geodata-mode: true
geox-url:
  geoip: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 48

profile:
  store-selected: true
  store-fake-ip: true

#嗅探器配置
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:

# TPROXY 模式不需要 TUN 配置，但保留为禁用状态以防误开启
tun:
  enable: false
  stack: gvisor
  device: Meta
  udp-timeout: 300
  auto-route: false
  auto-redirect: false
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  ipv6-timeout: 300
  enhanced-mode: redir-host
  nameserver-policy:
    'rule-set:userDirect':
      - https://dns.alidns.com/dns-query#中国网站
      - https://doh.pub/dns-query#中国网站

    'rule-set:userProxy': 
      - https://cloudflare-dns.com/dns-query#代理
      - https://dns.google/dns-query#代理

    'geosite:cn,private,googlefcm':
      - https://dns.alidns.com/dns-query#中国网站
      - https://doh.pub/dns-query#中国网站
  nameserver:
    - https://cloudflare-dns.com/dns-query#代理
    - https://dns.google/dns-query#代理

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#中国网站
    - https://doh.pub/dns-query#中国网站

#-----------------------------------------------------------------------------
#机场订阅全局设置
pp: &pp
  type: http
  interval: 21600
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 900
    timeout: 3000
    lazy: true
    expected-status: 204

proxy-providers:
#如果想要修改机场名（机场1等），需要全改，建议使用编辑器的查找替换功能
#如果想要删除几个机场，在下面的策略组也要删除对应部分，否则内核无法启动

  机场1:
    <<: *pp
    url: "订阅链接"
    path: ./proxy_providers/机场1.yaml

  机场2:
    <<: *pp
    url: "订阅链接"
    path: ./proxy_providers/机场2.yaml
    
#------------------------------------------------------------------------------
proxy-groups:

  - name: 代理
    type: select
    proxies:
      - 自动切换
      - 智能选择


  - name: 自动切换
    type: fallback
    include-all: true
    filter: '美国|USA|美國|us|US|United States'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204
    url: 'https://www.gstatic.com/generate_204'


  - name: 智能选择
    type: smart
    policy-priority: "US:1.2,美国:0.9"
    uselightgbm: true
    collectdata: false
    strategy: sticky-sessions
    prefer-asn: true
    include-all: true
    filter: '美国|USA|美國|us|US|United States'

#----------------------------------------------------------------
  - name: 广告
    type: select
    proxies:
      - REJECT-DROP 
      - PASS

  - name: 中国网站
    type: select
    proxies:
      - DIRECT
      - 代理
#-------------------------------------------------------------------

rule-providers:

  userDirect:
    type: file
    behavior: classical
    path: ./rule_providers/userDirect.yaml

  userProxy:
    type: file
    behavior: classical
    path: ./rule_providers/userProxy.yaml

  秋风广告规则:
    type: http
    behavior: classical
    format: yaml
    path: ./rule_providers/AWAvenue-Ads-Rule-Clash.yaml
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml"
    interval: 86400

rules:

  - RULE-SET,userProxy,代理
  - RULE-SET,userDirect,中国网站
  
  - GEOSITE,googlefcm,DIRECT
  
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT

  - RULE-SET,秋风广告规则,广告

  - GEOSITE,CN,中国网站
  - GEOIP,CN,中国网站,no-resolve

  - MATCH,代理
